# Compila en un Mac de GitHub, pasa los tests en el simulador y genera un
# .ipa sin firmar para instalarlo con SideStore, AltStore o Sideloadly.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Elegir la versión más reciente de Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Tests unitarios (simulador)
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo "iPhone 17")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          echo "Simulador: $SIM"
          set -o pipefail
          xcodebuild test             -project SlowMode.xcodeproj -scheme SlowMode             -destination "platform=iOS Simulator,name=$SIM"             -only-testing:SlowModeTests             -resultBundlePath TestResults.xcresult             | tee test.log | grep -iE "error:|warning: |test case|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      # Auditoría de accesibilidad y tiempo de arranque: informativas, no bloquean el .ipa.
      - name: Tests de interfaz y accesibilidad (simulador)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test             -project SlowMode.xcodeproj -scheme SlowMode             -destination "platform=iOS Simulator,name=$SIM"             -only-testing:SlowModeUITests             -resultBundlePath UITestResults.xcresult             | tee uitest.log | grep -iE "error:|test case|\*\* TEST|A11Y " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" uitest.log

      - name: Resumen de tests
        if: always()
        run: |
          for BUNDLE in TestResults.xcresult UITestResults.xcresult; do
            [ -d "$BUNDLE" ] || continue
            echo "== $BUNDLE"
            xcrun xcresulttool get test-results summary --path "$BUNDLE" --compact || true
            echo
            xcrun xcresulttool get test-results tests --path "$BUNDLE" --compact               | python3 -c 'import json,sys
          def walk(n, out):
              if n.get("nodeType") == "Test Case": out.append((n.get("result"), n.get("name")))
              for c in n.get("children", []): walk(c, out)
          out = []
          for n in json.load(sys.stdin).get("testNodes", []): walk(n, out)
          for r, name in out: print(("OK   " if r == "Passed" else "FAIL ") + str(name))' || true
          done
          if [ -f uitest.log ]; then
            echo "== Accesibilidad"
            grep -oE "A11Y \[.*" uitest.log | sort -u || echo "Sin problemas registrados"
            echo "== Arranque"
            grep -iE "Duration \(AppLaunch\)|launch.*average" uitest.log | head -5 || true
          fi

      - name: Compilar para iPhone (sin firmar)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SlowMode.xcodeproj -scheme SlowMode \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | grep -E "error:|warning: |\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/SlowMode.app

      - name: Empaquetar el .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SlowMode.app Payload/
          zip -qry SlowMode.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SlowMode-ipa
          path: SlowMode.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            test.log
            uitest.log
          if-no-files-found: ignore
